<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* * {
            transition: width 0.3s ease-in-out;
        } */

        body {
            background: linear-gradient(to right, #152e6b, #d1e7f7);
        }

        #border {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row d-flex align-items-center mb-3">
            <div class="col-6 p-3">
                <div class="h3 text-white">Bento Layout</div>
            </div>
        </div>

        <div class="card shadow p-3 mx-5 mb-5 border-0" id="border">
            <div class="d-flex flex-column row-gap-3">

                <!-- 1st row -->
                <div class="row g-3">
                    <div class="col-lg-6 col-sm-12">
                        <div class="p-3 text-white d-flex align-items-center" style="font-family: 'Poppins', sans-serif; font-size: 25px; height: clamp(100px, 20vh, 300px);">
                            Capture each moment,  admire every scenery, and cherish the memories in just  a snap of a button. 
                        </div>
                    </div>
                    <div class="col-lg-3 col-sm-6">
                        <div class="card border-0 overflow-hidden" style="height: clamp(100px, 20vh, 300px);">
                            <img src="assets/img/people_party.jpg" alt="people partying" class="card-img h-100 w-100 object-fit-cover">
                        </div>
                    </div>
                    <div class="col-lg-3 col-sm-6">
                        <div class="card border-0 overflow-hidden" style="height: clamp(100px, 20vh, 300px);">
                            <img src="assets/img/people_talking.jpg" alt="people talking" class="card-img h-100 w-100 object-fit-cover">
                        </div>
                    </div>
                </div>

                <!-- 2nd row -->
                <div class="row g-3">

                    <!-- row 2.1 -->
                    <div class="col-lg-3 col-sm-12">
                        <div class="row g-3">
                            <div class="col-lg-12 col-sm-6">
                                <div class="card border-0 overflow-hidden" style="height: clamp(100px, 18vh, 200px);">
                                    <img src="assets/img/city_light.jpg" alt="city light image"
                                        class="card-img h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                            <div class="col-lg-12 col-sm-6">
                                <div class="card border-0 overflow-hidden" style="height: clamp(100px, 18vh, 200px);">
                                    <img src="assets/img/street_lights.jpg" alt="street light image"
                                        class="card-img h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- big card -->
                    <div class="col-lg-6 col-sm-12">
                        <div class="card border-0 overflow-hidden" style="height: clamp(200px, 38.2vh, 400px);">
                            <img src="assets/img/camera.jpeg" alt="camera image"
                                class="card-img h-100 w-100 object-fit-cover">
                            <div class="card-img-overlay d-flex align-items-center">
                                <p class="text-white mb-0 ms-4" style="font-family: 'Parisienne', cursive; font-size: clamp(30px, 10vh, 50px);">Click,<br>Cherish,<br>Repeat</p>
                            </div>
                        </div>
                    </div>

                    <!-- row 2.2 -->
                    <div class="col-lg-3 col-sm-12">
                        <div class="row g-3 h-100">
                            <div class="col-lg-6 col-sm-3">
                                <div class="card border-0 overflow-hidden" style="height: clamp(100px, 18vh, 200px);">
                                    <img src="assets/img/zoom.jpg" alt="zoom feature" class="card-img h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                            <div class="col-lg-6 col-sm-3">
                                <div class="card border-0 overflow-hidden" style="height: clamp(100px, 18vh, 200px);">
                                    <img src="assets/img/portability.jpg" alt="portability feature" class="card-img h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                            <div class="col-lg-6 col-sm-3">
                                <div class="card border-0 overflow-hidden" style="height: clamp(100px, 18vh, 200px);">
                                    <img src="assets/img/night_photography.jpg" alt="night photography" class="card-img h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                            <div class="col-lg-6 col-sm-3">
                                <div class="card border-0 overflow-hidden" style="height: clamp(100px, 18vh, 200px);">
                                    <img src="assets/img/focus.jpg" alt="focus feature" class="card-img h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3rd row -->
                <div class="row">
                    <div class="col-12">
                        <div class="card border-0 overflow-hidden" style="height: clamp(100px, 20vh, 300px);">
                            <img src="assets/img/panorama_img.jpg" alt="Panorama Image"
                                class="card-img h-100 w-100 object-fit-cover">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
