<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-image: url('assets/img/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        #border {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            /* Safari */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="h1 text-center my-4">Bento Layout</div>

        <div class="card shadow p-3" style="min-height: 80vh;" id="border">
            <div class="d-flex flex-column row-gap-3">

                <!-- 1st row -->
                <div class="row" style="min-height: 20vh;">
                    <div class="col-6">
                        <div class="card p-3 h-100">

                        </div>
                    </div>
                    <div class="col-3">
                        <div class="card p-3 h-100">

                        </div>
                    </div>
                    <div class="col-3">
                        <div class="card p-3 h-100">

                        </div>
                    </div>
                </div>

                <!-- 2nd row -->
                <div class="row" style="min-height: 40vh;">
                    <div class="col-3 d-flex flex-column gap-3">

                        <!-- row 2.1 -->
                        <div class="card p-3 flex-fill">

                        </div>
                        <div class="card p-3 flex-fill">

                        </div>

                    </div>

                    <div class="col-6">
                        <div class="card p-3 h-100">

                        </div>
                    </div>

                    <div class="col-3 d-flex flex-column gap-3">

                        <!-- row 2.2 -->
                            <div class="d-flex gap-3 flex-fill">
                                <div class="card p-3 w-50">

                                </div>
                                <div class="card p-3 w-50">

                                </div>
                            </div>

                            <div class="d-flex gap-3 flex-fill">
                                <div class="card p-3 w-50">

                                </div>
                                <div class="card p-3 w-50">
                                    
                                </div>
                            </div>

                    </div>
                </div>

                <!-- 3rd row -->
                <div class="row" style="min-height: 20vh;">
                    <div class="col-12">
                        <div class="card p-3 h-100">

                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
