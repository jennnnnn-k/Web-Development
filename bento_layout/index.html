<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* * {
            transition: width 0.3s ease-in-out;
        } */

        #border {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row d-flex align-items-center" style="background: black;">
            <div class="col-6 p-3">
                <div class="h3 text-white">Bento Layout</div>
            </div>
        </div>

        <div class="card shadow p-3 m-5" id="border">
            <div class="d-flex flex-column row-gap-3">

                <!-- 1st row -->
                <div class="row g-3">
                    <div class="col-lg-6 col-sm-12">
                        <div class="card p-3 h-100">
                            Capture each moment
                        </div>
                    </div>
                    <div class="col-lg-3 col-sm-6">
                        <div class="card p-3 h-100">

                        </div>
                    </div>
                    <div class="col-lg-3 col-sm-6">
                        <div class="card p-3 h-100">

                        </div>
                    </div>
                </div>

                <!-- 2nd row -->
                <div class="row g-3">

                    <!-- row 2.1 -->
                    <div class="col-lg-3 col-sm-12">
                        <div class="row g-3 h-100">
                            <div class="col-lg-12 col-sm-6">
                                <div class="card p-3 h-100">

                                </div>
                            </div>
                            <div class="col-lg-12 col-sm-6">
                                <div class="card p-3 h-100">

                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- big card -->
                    <div class="col-lg-6 col-sm-12">
                        <div class="card border-0 overflow-hidden" style="height: clamp(200px, 36vh, 400px);">
                            <img src="assets/img/camera.jpeg" alt="camera image" class="card-img h-100 w-100 object-fit-cover">
                        </div>
                    </div>

                    <!-- row 2.2 -->
                    <div class="col-lg-3 col-sm-12">
                        <div class="row g-3 h-100">
                            <div class="col-lg-6 col-sm-3">
                                <div class="card border-0 overflow-hidden" style="height: clamp(100px, 20vh, 200px);">
                                    <img src="assets/img/city_light.jpg" alt="city light image" class="card-img h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                            <div class="col-lg-6 col-sm-3">
                                <div class="card p-3 h-100">

                                </div>
                            </div>
                            <div class="col-lg-6 col-sm-3">
                                <div class="card p-3 h-100">

                                </div>
                            </div>
                            <div class="col-lg-6 col-sm-3">
                                <div class="card p-3 h-100">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3rd row -->
                <div class="row">
                    <div class="col-12">
                        <div class="card border-0 overflow-hidden" style="height: clamp(100px, 20vh, 300px);">
                            <img src="assets/img/panorama_img.jpg" alt="Panorama Image" class="card-img h-100 w-100 object-fit-cover">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
